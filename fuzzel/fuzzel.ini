# fuzzel — application launcher, Breeze Dark colors
# Docs: man 5 fuzzel.ini

font=Noto Sans:size=11
dpi-aware=yes

prompt="  "
placeholder="Search applications…"
icons-enabled=yes
icon-theme=Breeze-Dark
terminal=foot

width=38
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=24

# Breeze Dark palette
[colors]
background=232629ff
text=eff0f1ff
prompt=3daee9ff
placeholder=7f8c8dff
input=eff0f1ff
match=3daee9ff
selection=3daee9ff
selection-text=232629ff
selection-match=eff0f1ff
counter=7f8c8dff
border=3daee9ff

[border]
width=1
radius=8

[dmenu]
exit-immediately-if-empty=yes
