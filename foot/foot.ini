# foot — Wayland terminal, Breeze Dark colors
# Docs: man 5 foot.ini

[main]
font=Noto Sans Mono:size=11
dpi-aware=yes
pad=10x10
selection-target=both

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=no

[colors]
# Breeze Dark / KDE Konsole "Breeze" scheme
foreground=eff0f1
background=232629
# Background translucency (0.0-1.0). niri blurs what shows through the
# translucent parts; see background-effect in ~/.config/niri/config.kdl.
alpha=0.9
regular0=232629
regular1=da4453
regular2=27ae60
regular3=fdbc4b
regular4=3daee9
regular5=9b59b6
regular6=1abc9c
regular7=eff0f1
bright0=7f8c8d
bright1=da4453
bright2=27ae60
bright3=fdbc4b
bright4=3daee9
bright5=9b59b6
bright6=1abc9c
bright7=eff0f1
selection-foreground=eff0f1
selection-background=3daee9

[csd]
preferred=server
