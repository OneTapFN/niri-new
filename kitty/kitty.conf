# kitty — Breeze Dark, перенесено з ~/.config/foot/foot.ini
# Docs: https://sw.kovidgoyal.net/kitty/conf/

font_family      Noto Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
# dpi-aware=yes у foot ≈ розмір у пунктах (типово в kitty)

# pad=10x10
window_padding_width 10

# scrollback lines=10000
scrollback_lines 10000

# cursor style=beam, blink=yes
cursor_shape beam
cursor_blink_interval 0.7

# mouse hide-when-typing=no — не ховати курсор миші під час друку
# (-1 = ніколи не ховати)
mouse_hide_wait -1

# selection-target=both — у kitty виділення/копіювання одразу йде
# і в primary selection, і в clipboard, тому окрема опція не потрібна

# Кольори: Breeze Dark / KDE Konsole "Breeze"
foreground            #eff0f1
background            #232629
# alpha=0.9 у foot; niri розмивать те, що під напівпрозорістю,
# см. background-effect у ~/.config/niri/config.kdl
background_opacity    0.9

# color0 = regular0 ... color7 = regular7
# color8 = bright0 ... color15 = bright7
color0  #232629
color1  #da4453
color2  #27ae60
color3  #fdbc4b
color4  #3daee9
color5  #9b59b6
color6  #1abc9c
color7  #eff0f1

color8  #7f8c8d
color9  #da4453
color10 #27ae60
color11 #fdbc4b
color12 #3daee9
color13 #9b59b6
color14 #1abc9c
color15 #eff0f1

# selection-foreground / selection-background
selection_foreground #eff0f1
selection_background #3daee9
